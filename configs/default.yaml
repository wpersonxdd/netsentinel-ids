# NetSentinel experiment configuration.
# Every command (`python -m nids <command> --config configs/default.yaml`) reads this file,
# so a run is fully reproducible from the config + seed.

seed: 42

paths:
  artifacts: artifacts        # trained model bundle, alert queues, analyst feedback
  reports: reports            # REPORT.md, figures/, results/*.json

data:
  # File or directory (all CSV/Parquet files inside are concatenated).
  # Point this at the official hackathon dataset once it is released.
  path: data/raw/synthetic_flows.csv
  label_column: null          # null = auto-detect (attack_cat, label, class, attack, ...)
  time_column: null           # null = auto-detect (timestamp, stime, ...); used for the drift experiment
  label_mode: family          # family = group fine-grained labels (e.g. "DoS Hulk" -> DoS); raw = keep as-is
  extra_drop_columns: []      # columns to exclude from the features in addition to IDs/IPs/timestamps
  max_rows: null              # stratified subsample for quick runs on very large datasets
  min_class_count: 10         # classes rarer than this cannot be learned or evaluated and are dropped
  test_size: 0.2
  val_size: 0.1

resampling:
  smote_target_ratio: 0.15    # SMOTE raises every minority class to >= ratio * size of the largest class
  majority_cap_ratio: 4.0     # hybrid: largest class is undersampled to ratio * size of the second-largest

models:
  logreg:
    C: 1.0
    max_iter: 1000
  random_forest:
    n_estimators: 150
    min_samples_leaf: 1
  hist_gb:
    max_iter: 300
    learning_rate: 0.1
    max_leaf_nodes: 31
    l2_regularization: 0.0
  deep_mlp:                   # PyTorch MLP with focal loss (skipped automatically if torch is missing)
    hidden_dims: [256, 128, 64]
    dropout: 0.2
    lr: 0.001
    batch_size: 512
    max_epochs: 30
    patience: 5
    gamma: 2.0                # focal-loss focusing parameter (0 = plain cross-entropy)

benchmark:
  models: [logreg, random_forest, hist_gb, deep_mlp, ensemble]
  strategies: [none, class_weight, smote, hybrid]
  selection_metric: macro_f1  # chosen on the validation set; the test set is used once, by `train`
  max_train_rows: null        # cap training rows during the benchmark (stratified, keeps rare classes)

final_model:
  model: auto                 # auto = best benchmark config, or one of the model names above
  strategy: auto

explain:
  permutation_rows: 4000      # validation rows used for permutation feature importance
  permutation_repeats: 3

novelty:
  benign_fpr: 0.01            # anomaly threshold = 99th percentile of benign validation scores
  method: lof                 # lof (Local Outlier Factor) | iforest (Isolation Forest)
  n_neighbors: 10             # LOF neighbourhood size
  max_fit_rows: 20000         # benign reference flows kept for the neighbour search
  n_estimators: 200           # iforest only
  # Leave-one-attack-out experiment: model retrained once per held-out family.
  loao_model: hist_gb
  loao_strategy: smote
  min_family_test_count: 15

drift:
  past_fraction: 0.65         # oldest 65% of traffic = "history" the model is trained on
  label_budget: 0.10          # share of new traffic an analyst labels for retraining
  psi_alert: 0.25             # PSI above this = significant feature drift
  prediction_shift_alert: 0.1 # PSI of the predicted-class mix above this = label/prediction shift
  unknown_rate_ratio_alert: 2.0  # Unknown-Anomaly rate doubling vs. history = something new is going on

feedback:
  # `nids all` closes the loop with a simulated analyst on the test split (the deployed model is not replaced):
  simulated_incidents: 100    # incidents reviewed, roughly one analyst-day
  review_order: review-first  # review-first: "needs review" incidents first (active learning) | priority
  weight: 1                   # copies of each analyst-labelled flow in retraining (raise to trust analysts more)

triage:
  confidence_threshold: 0.6   # alerts below this confidence are flagged for manual review
  severity:                   # attack family -> severity; unknown families default to "medium"
    Benign: none
    PortScan: low
    Probe: low
    Reconnaissance: low
    Fuzzers: low
    Analysis: medium
    BruteForce: medium
    R2L: medium
    Generic: medium
    DoS: high
    WebAttack: high
    Exploits: high
    Unknown-Anomaly: low        # a lead, not a confirmed threat; incidents with many flows escalate automatically
    DDoS: critical
    Botnet: critical
    Infiltration: critical
    Exfiltration: critical
    Exploit: critical
    Backdoor: critical
    Shellcode: critical
    Worms: critical
    U2R: critical
