[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentinel-ids"
version = "0.1.0"
description = "Imbalance-aware network intrusion detection with novel-attack detection and an analyst alert-triage interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "imbalanced-learn>=0.12",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dl = ["torch>=2.2"]
app = ["streamlit>=1.50"]
dev = ["pytest>=7.4"]

[project.scripts]
nids = "nids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
