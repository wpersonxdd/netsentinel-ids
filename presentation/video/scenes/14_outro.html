<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Outro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="../neon.css">
<style>
  .claims { display: flex; gap: 70px; justify-content: center; }
  .claim { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 460px; }
  .claim .ico { width: 110px; height: 110px; filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 18px currentColor); }
  .claim p { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 40px; font-weight: 700; color: var(--text); text-align: center; }
</style></head>
<body>
<div class="stage">
  <div class="abs" style="left:0;top:96px;width:1920px;display:flex;flex-direction:column;align-items:center;gap:18px">
    <div class="cyan neon" style="width:140px;height:140px"><div data-icon="logo" class="draw-all" style="--at:0.2s;width:140px;height:140px"></div></div>
    <p class="big flick" style="--at:0.6s;font-size:110px;text-shadow:0 0 18px rgba(59,240,255,.8),0 0 60px rgba(77,139,255,.6)">NetSentinel</p>
  </div>
  <div class="abs claims" style="left:0;top:470px;width:1920px">
    <div class="claim cyan pop" style="--at:var(--c0);--off:.2s"><div class="ico" data-icon="target"></div><p>Rare attacks found</p></div>
    <div class="claim mag pop" style="--at:var(--c0);--off:1.4s"><div class="ico" data-icon="ghost"></div><p>New ones flagged</p></div>
    <div class="claim lime pop" style="--at:var(--c0);--off:2.6s"><div class="ico" data-icon="loop"></div><p>Analysts in the loop</p></div>
  </div>
  <div class="abs" style="left:0;top:760px;width:1920px;display:flex;flex-direction:column;align-items:center;gap:22px">
    <p class="chip cyan mono fade-up" style="--at:var(--c1);font-size:32px"><i data-icon="code" style="width:40px;height:40px"></i><span>github.com/wpersonxdd/netsentinel-ids</span></p>
    <p class="fade-up" style="--at:var(--c1);--off:1s;font-size:28px;color:var(--muted)">Rustamjonov Komron Davronovich · DataNova 2026 · DN-CY-01</p>
  </div>
</div>
<script src="../neon.js"></script>
</body></html>
