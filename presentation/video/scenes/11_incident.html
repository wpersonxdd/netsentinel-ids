<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Incident</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="../neon.css">
<style>
  .layer { position: absolute; left: 0; top: 0; width: 1152px; height: 648px; }
  .items { position: absolute; left: 1330px; top: 282px; width: 470px; display: flex; flex-direction: column; gap: 26px; }
  .item { display: flex; gap: 20px; align-items: flex-start; padding: 18px 20px; border-radius: 16px; border: 2px solid currentColor;
    background: rgba(5, 14, 40, .75); box-shadow: 0 0 16px -4px currentColor; }
  .item .ico { width: 54px; height: 54px; flex: none; filter: drop-shadow(0 0 6px currentColor); }
  .item p { font-size: 25px; line-height: 1.3; color: var(--text); }
  .item b { display: block; font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 2px; color: currentColor; margin-bottom: 4px; }
</style></head>
<body>
<div class="stage">
  <div class="hd">
    <p class="kicker fade-up" style="--off:.15s">10 · INSIDE AN INCIDENT</p>
    <h1 class="fade-up" style="--off:.3s">Every incident explains itself</h1>
  </div>

  <div class="screen zoom-in" style="--at:0.2s;left:120px;top:282px;width:1152px;height:648px">
    <div id="cam" class="layer">
      <img src="../../../docs/media/screens/console_incident.png" alt="">
      <div class="hl pop" style="--at:var(--c0);--off:.5s;left:219px;top:310px;width:315px;height:111px;border-color:var(--cyan);box-shadow:0 0 14px var(--cyan),0 0 14px var(--cyan) inset"></div>
      <div class="hl pop" style="--at:var(--c1);--off:.5s;left:219px;top:270px;width:310px;height:42px"></div>
      <div class="hl pop" style="--at:var(--c2);--off:.5s;left:749px;top:309px;width:362px;height:88px;border-color:var(--amber);box-shadow:0 0 14px var(--amber),0 0 14px var(--amber) inset"></div>
      <div class="hl pop" style="--at:var(--c3);--off:.5s;left:221px;top:449px;width:890px;height:182px;border-color:var(--lime);box-shadow:0 0 14px var(--lime),0 0 14px var(--lime) inset"></div>
    </div>
  </div>

  <div class="items">
    <div class="item cyan fade-up" style="--at:var(--c0)"><div class="ico" data-icon="magnifier"></div>
      <p><b>WHY</b>the features furthest from normal traffic</p></div>
    <div class="item mag fade-up" style="--at:var(--c1)"><div class="ico" data-icon="target"></div>
      <p><b>HOW SURE</b>possible families, a 90% guarantee for each (conformal prediction)</p></div>
    <div class="item amber fade-up" style="--at:var(--c2)"><div class="ico" data-icon="doc"></div>
      <p><b>WHAT TO DO</b>a recommended first response</p></div>
    <div class="item lime fade-up" style="--at:var(--c3)"><div class="ico spin" style="animation-duration:3s" data-icon="loop"></div>
      <p><b>THE LOOP</b>one decision labels all 9,204 flows, the model retrains on them</p></div>
  </div>
</div>
<script src="../neon.js"></script>
<script>
  const c = cueTime;
  camera(document.getElementById('cam'), 1152, 648, [
    { t: 0, s: 1, x: 576, y: 324 },
    { t: c(0), s: 1.75, x: 376, y: 365 },
    { t: c(1), s: 2, x: 376, y: 291 },
    { t: c(2), s: 1.7, x: 930, y: 352 },
    { t: c(3), s: 1.15, x: 664, y: 540 },
  ], 1.3);
</script>
</body></html>
